<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админка TET-A-TET{% endblock %}</title>
    <!-- HTMX для интерактивности без React -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Tailwind CSS для красивых стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Кастомные стили */
        .htmx-request { opacity: 0.5; pointer-events: none; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Навигация -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-purple-600">🦊 TET-A-TET Админ</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin/dashboard" class="text-gray-600 hover:text-purple-600">Дашборд</a>
                    <a href="/admin/verifications" class="text-gray-600 hover:text-purple-600">Верификации</a>
                    <a href="/admin/users" class="text-gray-600 hover:text-purple-600">Пользователи</a>
                    <a href="/admin/meetings" class="text-gray-600 hover:text-purple-600">Встречи</a>
                    <form action="/admin/logout" method="POST" class="inline">
                        <button type="submit" class="text-red-500 hover:text-red-700">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% if message %}
        <div class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
            {{ message }}
        </div>
        {% endif %}
        {% if error %}
        <div class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
            {{ error }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
