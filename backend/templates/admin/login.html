<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — TET-A-TET</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-black min-h-screen flex items-center justify-center">
    <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🦊</div>
            <h1 class="text-2xl font-bold text-white">TET-A-TET Админ</h1>
            <p class="text-gray-300 mt-2">Войдите как администратор</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-200 rounded-lg text-sm">
            {{ error }}
        </div>
        {% endif %}

        {% if step == "code" %}
        <!-- Шаг 2: Ввод кода -->
        <form hx-post="/admin/login/verify" hx-target="#verify-result" hx-swap="innerHTML" class="space-y-4">
            <div id="verify-result" class="hidden"></div>
            <input type="hidden" name="phone" value="{{ phone }}">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Код из SMS</label>
                <input type="text" name="code" maxlength="4" required
                    class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-purple-500"
                    placeholder="••••">
            </div>
            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
                Войти
            </button>
        </form>
        {% else %}
        <!-- Шаг 1: Ввод телефона -->
        <form hx-post="/admin/login/send-code" hx-swap="none" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Номер телефона</label>
                <input type="text" name="phone" required
                    class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    placeholder="+79991234567">
            </div>
            <button type="submit" id="send-code-btn"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
                Отправить код
            </button>
        </form>
        {% endif %}

        <p class="text-gray-400 text-xs text-center mt-6">
            Только для администраторов системы
        </p>
    </div>

    <script>
        // После отправки кода — перезагружаем страницу с шагом "code"
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.pathInfo?.requestPath === '/admin/login/send-code') {
                const phone = evt.detail.elt.querySelector('input[name="phone"]').value;
                window.location.href = '/admin/login?step=code&phone=' + encodeURIComponent(phone);
            }
        });

        // После успешной верификации — редирект на дашборд
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.pathInfo?.requestPath === '/admin/login/verify') {
                // Если статус 200 или 303 — значит успех, редиректим
                if (evt.detail.xhr.status >= 200 && evt.detail.xhr.status < 400) {
                    window.location.href = '/admin/dashboard';
                }
            }
        });
    </script>
</body>
</html>
